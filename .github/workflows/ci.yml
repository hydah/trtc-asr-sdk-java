name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # 17 is the source/target level in pom.xml; 21 is the next LTS a
        # customer is likely to run the jar on.
        java: ["17", "21"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Test
        run: mvn -B --no-transfer-progress test

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Package
        run: mvn -B --no-transfer-progress package

      - uses: actions/upload-artifact@v4
        with:
          name: trtc-asr-sdk-jar
          path: target/*.jar
          if-no-files-found: error
